<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant Risk Memory — Dodo Payments</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/webp" href="/assets/dodo-mark.webp">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo">
      <img class="mark" src="/assets/dodo-mark.webp" alt="" width="32" height="32">
      <span class="wm">Dodo</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="statuscard">
      <div class="t">Memory layer status</div>
      <div class="live"><i></i> Active</div>
      <div class="kv"><span>Active memories</span><b id="st-mem">—</b></div>
      <div class="kv"><span>Last reconciled</span><b id="st-when">—</b></div>
      <div class="track"><i id="st-bar" style="width:0%"></i></div>
      <button id="reset" title="Rebuild the synthetic corpus from seed 20260820">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg>
        Reset demo
      </button>
    </div>
    <div class="userchip">
      <div class="av">AP</div>
      <div><div class="nm">Anushika Poddar</div><div class="rl">Risk &amp; Underwriting</div></div>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="globalsearch" type="search" autocomplete="off"
               placeholder="Search merchants, memories, or alerts…">
      </div>
      <button class="bell" id="bell" title="Merchants needing a human">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot" id="belldot" hidden></span>
      </button>
    </header>
    <main id="main"><div class="page"><div class="empty">Loading&hellip;</div></div></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
